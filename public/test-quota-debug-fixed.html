<!DOCTYPE html>
<html>
<head>
    <title>Test Quota Debug</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .section { border: 1px solid #ddd; margin: 10px 0; padding: 15px; }
        .error { color: red; }
        .success { color: green; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        button { padding: 10px 15px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Test Quota Debug</h1>
    
    <div class="section">
        <h2>Test API Simple - Check</h2>
        <button onclick="testSimple()">Tester API Simple Check</button>
        <div id="resultSimple"></div>
    </div>
    
    <div class="section">
        <h2>Test API Temporaire - Check</h2>
        <button onclick="testTemp()">Tester API Temporaire Check</button>
        <div id="resultTemp"></div>
    </div>
    
    <div class="section">
        <h2>Test API Temporaire - Consume</h2>
        <button onclick="testTempConsume()">Tester API Temporaire Consume</button>
        <div id="resultTempConsume"></div>
    </div>
    
    <div class="section">
        <h2>Test API Originale - Check</h2>
        <button onclick="testOriginal()">Tester API Originale Check</button>
        <div id="resultOriginal"></div>
    </div>
    
    <div class="section">
        <h2>Test API Originale - Consume</h2>
        <button onclick="testOriginalConsume()">Tester API Originale Consume</button>
        <div id="resultOriginalConsume"></div>
    </div>

    <script>
        function showResult(elementId, response, data) {
            const element = document.getElementById(elementId);
            const statusClass = response.status >= 400 ? 'error' : 'success';
            element.innerHTML = `
                <div class="${statusClass}">Status: ${response.status}</div>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
        }

        async function testSimple() {
            try {
                const response = await fetch('/api/test-quota', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        adminId: 'test-admin-id',
                        action: 'check' 
                    })
                });
                const data = await response.json();
                showResult('resultSimple', response, data);
            } catch (error) {
                document.getElementById('resultSimple').innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        async function testTemp() {
            try {
                const response = await fetch('/api/quota-manager-temp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        adminId: 'test-admin-id',
                        action: 'check' 
                    })
                });
                const data = await response.json();
                showResult('resultTemp', response, data);
            } catch (error) {
                document.getElementById('resultTemp').innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        async function testTempConsume() {
            try {
                const response = await fetch('/api/quota-manager-temp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        adminId: 'test-admin-id',
                        action: 'consume',
                        sessionId: 'test-session-' + Date.now(),
                        projectId: 'test-project-id'
                    })
                });
                const data = await response.json();
                showResult('resultTempConsume', response, data);
            } catch (error) {
                document.getElementById('resultTempConsume').innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        async function testOriginal() {
            try {
                const response = await fetch('/api/quota-manager', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        adminId: 'test-admin-id',
                        action: 'check' 
                    })
                });
                const data = await response.json();
                showResult('resultOriginal', response, data);
            } catch (error) {
                document.getElementById('resultOriginal').innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        async function testOriginalConsume() {
            try {
                const response = await fetch('/api/quota-manager', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        adminId: 'test-admin-id',
                        action: 'consume',
                        sessionId: 'test-session-' + Date.now(),
                        projectId: 'test-project-id'
                    })
                });
                const data = await response.json();
                showResult('resultOriginalConsume', response, data);
            } catch (error) {
                document.getElementById('resultOriginalConsume').innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
