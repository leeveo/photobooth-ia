        async function testTable() {

            results.innerHTML += '<h3>1. Test SELECT sur project_images</h3>';
            const { data: selectData, error: selectError } = await supabase
                .from('project_images')
                .select('*')
                .limit(1);
            
            if (selectError) {
                results.innerHTML += `<p style="color: red;">❌ ERREUR SELECT: ${selectError.message}</p>`;
                results.innerHTML += `<pre>${JSON.stringify(selectError, null, 2)}</pre>`;
            } else {
                results.innerHTML += `<p style="color: green;">✅ SELECT fonctionne! Nombre de lignes: ${selectData?.length || 0}</p>`;
                results.innerHTML += `<pre>${JSON.stringify(selectData, null, 2)}</pre>`;
            }
            
            // Test 2: Test INSERT
            results.innerHTML += '<h3>2. Test INSERT dans project_images</h3>';
            const testProjectId = 'a11f8c3a-b082-4c85-bec8-ca9865a7e01d';
            const testImageUrl = 'https://test.example.com/test-' + Date.now() + '.jpg';
            
            const { data: insertData, error: insertError } = await supabase
                .from('project_images')
                .insert([{
                    project_id: testProjectId,
                    image_url: testImageUrl,

                .select();
            
            if (insertError) {

            results.innerHTML += `<p>Colonnes disponibles: vérifier dans la réponse ci-dessus</p>`;

        testTable();
