<!DOCTYPE html>
<html>
<head>
    <title>Debug Quota Direct</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Debug Quota Direct</h1>
    <div id="results"></div>

    <script>
        const SUPABASE_URL = 'https://gyohqmahwntkmebayeej.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5b2hxbWFod250a21lYmF5ZWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjY1NzA2NjQsImV4cCI6MjA0MjE0NjY2NH0.kCkSNMcgJMINEaHl6B8hZKDd7hb7gy-KYI7zI0fMHUw';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const adminId = '7a77784c-7864-4fbb-8cb5-1f9b40ca1f62';

        async function debugQuotaDirect() {
            console.log('=== DEBUG QUOTA DIRECT ===');
            
            try {
                // 1. Récupérer le dernier paiement
                const { data: paymentData, error: paymentError } = await supabase
                    .from('admin_payments')
                    .select('photo_quota, photo_quota_reset_at, created_at')
                    .eq('admin_user_id', adminId)
                    .eq('status', 'succeeded')
                    .in('stripe_subscription_status', ['active', 'trialing'])
                    .gte('quota_expires_at', new Date().toISOString())
                    .order('created_at', { ascending: false })
                    .limit(1)
                    .maybeSingle();

                console.log('Payment data:', paymentData, paymentError);

                // 2. Récupérer admin création
                const { data: adminData, error: adminError } = await supabase
                    .from('admin_users')
                    .select('created_at')
                    .eq('id', adminId)
                    .single();

                console.log('Admin data:', adminData, adminError);

                // 3. Déterminer quota et resetAt
                let quota = 3;
                let resetAt = adminData?.created_at || new Date().toISOString();

                if (paymentData) {
                    quota = paymentData.photo_quota || 0;
                    resetAt = paymentData.photo_quota_reset_at || resetAt;
                }

                console.log('Quota de base:', quota);
                console.log('Reset à:', resetAt);

                // 4. Récupérer addons
                const { data: addonData } = await supabase
                    .from('addon_purchases')
                    .select('addon_value')
                    .eq('admin_user_id', adminId)
                    .eq('status', 'completed');

                const addonPhotos = addonData?.reduce((total, purchase) => {
                    return total + (purchase.addon_value || 0);
                }, 0) || 0;

                console.log('Photos addon:', addonPhotos);

                const totalQuota = quota + addonPhotos;
                console.log('Quota total:', totalQuota);

                // 5. Compter quota_usage depuis resetAt
                const { count, error: usageError } = await supabase
                    .from('quota_usage')
                    .select('id', { count: 'exact', head: true })
                    .eq('admin_user_id', adminId)
                    .gte('consumed_at', resetAt);

                console.log('Quota usage count:', count, usageError);

                // 6. Récupérer quelques enregistrements pour debug
                const { data: usageRecords } = await supabase
                    .from('quota_usage')
                    .select('*')
                    .eq('admin_user_id', adminId)
                    .order('consumed_at', { ascending: false })
                    .limit(15);

                console.log('Recent quota usage records:', usageRecords);

                // Afficher les résultats
                document.getElementById('results').innerHTML = `
                    <h2>Résultats Debug</h2>
                    <p><strong>Admin ID:</strong> ${adminId}</p>
                    <p><strong>Quota de base:</strong> ${quota}</p>
                    <p><strong>Photos addon:</strong> ${addonPhotos}</p>
                    <p><strong>Quota total:</strong> ${totalQuota}</p>
                    <p><strong>Reset à:</strong> ${resetAt}</p>
                    <p><strong>Photos utilisées depuis reset:</strong> ${count || 0}</p>
                    <p><strong>Photos restantes:</strong> ${totalQuota - (count || 0)}</p>
                    
                    <h3>Derniers enregistrements quota_usage:</h3>
                    <pre>${JSON.stringify(usageRecords, null, 2)}</pre>
                `;

            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('results').innerHTML = `<p style="color: red;">Erreur: ${error.message}</p>`;
            }
        }

        // Lancer le debug
        debugQuotaDirect();
    </script>
</body>
</html>
